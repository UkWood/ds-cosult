<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ДС-консультант</title>
<style>
:root { color-scheme: light; font-family: system-ui,sans-serif; color: #182a34; background: #eef3f1; }
* { box-sizing: border-box; }
body { margin: 0; }
main { max-width: 820px; padding: clamp(20px,5vw,56px); margin: auto; }
h1 { margin: 0; font-size: clamp(30px,5vw,48px); letter-spacing: -.06em; }
header { border-bottom: 1px solid #becdc8; margin-bottom: 24px; }
header p { margin: 8px 0 20px; color: #446056; }
.suggestions { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 24px; }
button { font: inherit; border: 1px solid #a8c2b9; padding: 9px 14px; border-radius: 9px; cursor: pointer; color: #184d40; background: white; }
button:hover { border-color: #145545; }
button:disabled { opacity: .55; cursor: wait; }
article { padding: 17px 20px; background: white; border: 1px solid #d6e0dc; border-radius: 12px; margin: 12px 0; overflow-wrap: anywhere; }
article.question { margin-left: 12%; background: #dcebe5; }
article p { white-space: pre-wrap; line-height: 1.6; margin: 8px 0; }
a { color: #14594a; }
details { margin-top: 12px; font-size: .9rem; }
pre { white-space: pre-wrap; overflow-wrap: anywhere; }
form { display: flex; gap: 10px; align-items: end; margin-top: 24px; }
label { flex: 1; font-weight: 600; }
textarea { display: block; font: inherit; margin-top: 6px; width: 100%; padding: 12px; resize: vertical; border: 1px solid #a8c2b9; border-radius: 9px; }
form button { background: #145545; color: white; }

[hidden] { display: none !important; }
.controls { display: flex; flex-wrap: wrap; gap: .7rem; align-items: center; margin: 1rem 0; }
select, input { font: inherit; padding: .45rem; }
#budget, #notice { line-height: 1.5; }
</style>
</head>
<body>
<main>
<header><h1>ДС-консультант</h1><p id="policy">Локальный поиск по проверенным источникам</p></header>
<p id="notice" role="status"></p>
<form id="recovery" hidden>
<label>Одноразовый код из терминала<input id="code" type="password" autocomplete="off" maxlength="64" required></label>
<button>Восстановить диалог</button>
</form>
<div id="workspace" hidden>
<div class="controls"><label>Маршрут <select id="mode"><option value="P0">P0 · локальный поиск</option></select></label>
<button type="button" id="new">Новый диалог</button><button type="button" id="reset">Сброс лаборатории</button></div>
<p id="budget" hidden></p>
<details><summary id="scope-title">Проверенные источники</summary><pre id="scope"></pre></details>
<div class="suggestions">
<button type="button" data-question="Какой диапазон температуры у БКД-ПК-RF.2?">Температура БКД-ПК-RF.2</button>
<button type="button" data-question="Что такое СЛДКС-1?">Назначение СЛДКС-1</button>
</div>
<section id="chat" role="log" aria-live="polite" aria-label="Диалог"></section>
<form id="form"><label>Ваш вопрос<textarea id="question" maxlength="1200" rows="2" required></textarea></label>
<button id="send" disabled>Отправить</button></form>
</div>
</main>
<script>
const $ = id => document.getElementById(id);
const statuses = {answered:"Подтверждено", partial:"Частичный ответ", clarification:"Нужно уточнение",
  needs_support:"Недостаточно сведений", blocked:"Запрос отклонён", error:"Ошибка проверки"};
let head, dialog, retry, unfinished = false, busy = false;
async function api(path, data) {
  const options = data === undefined ? {} : {method:"POST", headers:{"Content-Type":"application/json"},
    body:JSON.stringify(data)};
  const response = await fetch("/api/" + path, options);
  const value = await response.json();
  if (!response.ok) throw new Error(value.text || "Ошибка локального сервера.");
  return value;
}
function message(text, kind) {
  const article = document.createElement("article");
  article.className = kind;
  const p = document.createElement("p");
  p.textContent = text;
  article.append(p);
  $("chat").append(article);
  return article;
}
function link(parent, text, url) {
  try { if (new URL(url).protocol !== "https:") return; } catch { return; }
  const a = document.createElement("a");
  a.href = url;
  a.textContent = text;
  a.target = "_blank";
  a.rel = "noopener noreferrer";
  const p = document.createElement("p");
  p.append(a);
  parent.append(p);
}
function render(question, answer) {
  message(question, "question");
  const article = message(answer.text, "answer");
  const title = document.createElement("strong");
  const route = answer.route_used ? " · " + answer.route_used : "";
  title.textContent = (statuses[answer.status] || answer.status || "") + route;
  article.prepend(title);
  for (const item of [...(answer.verified_claims || []), ...(answer.document_references || []), ...(answer.conflict_positions || [])]) {
    if (item.document_url) link(article, item.text, item.document_url);
    if (item.citation) link(article, "Источник · " + item.citation.locator, item.citation.url);
  }
  if (answer.paid_receipt) {
    const r = answer.paid_receipt, receipt = document.createElement("p");
    receipt.textContent = r.state === "usage_reconciled" ?
      "Токены: вход " + r.prompt_tokens + ", выход " + r.completion_tokens + ". Оценка по usage: " + usd(r.usage_estimate_micro_usd) + "." :
      "Попытка DeepSeek: " + r.state + ". Оценка расходов по usage недоступна.";
    article.append(receipt);
  }
  const details = document.createElement("details"), summary = document.createElement("summary");
  summary.textContent = "Запрос, QuestionNeeds, источники и проверка";
  const proof = document.createElement("pre");
  proof.textContent = JSON.stringify(answer, null, 2);
  details.append(summary, proof);
  article.append(details);
}
function usd(micro) { return "$" + (micro / 1000000).toFixed(6); }
async function state() {
  const s = await api("session");
  $("policy").textContent = s.lab ? "Лабораторный режим" : "POLICY_TEST · проверка ограничений";
  $("new").hidden = $("reset").hidden = !s.lab;
  $("workspace").hidden = !s.authenticated;
  $("recovery").hidden = !s.lab || s.authenticated;
  $("notice").textContent = s.text || (s.unfinished ?
    "Есть незавершённый запрос. Обновите страницу для проверки. После остановки сервера можно выполнить сброс лаборатории." : "");
  if (!s.authenticated) { $("chat").replaceChildren(); return false; }
  head = s.next_request;
  dialog = s.dialog;
  unfinished = s.unfinished;
  if (s.live && $("mode").options.length === 1) {
    $("mode").add(new Option("DeepSeek (эксперимент) · P1, разбор вопроса", "P1"));
    $("mode").add(new Option("DeepSeek (эксперимент) · P2, отбор свидетельств", "P2"));
  }
  if (!s.live) while ($("mode").options.length > 1) $("mode").remove(1);
  const b = s.budget;
  $("budget").hidden = !s.lab;
  if (!b) $("budget").textContent = "P0 работает локально. Платные вызовы отключены. Учёт расходов доступен при запуске эксперимента DeepSeek.";
  if (b) $("budget").textContent = "Резерв до отправки: " + usd(b.per_request_micro_usd) + " за попытку. Осталось попыток: " + b.remaining_calls +
    ". Остаток лимита: " + usd(b.remaining_micro_usd) + ". Зарезервировано: " + usd(b.reserved_micro_usd) +
    ". Оценка по usage: " + usd(b.usage_estimate_micro_usd) + ". Неподтверждённые расходы: " + usd(b.at_risk_micro_usd) + ".";
  $("scope-title").textContent = "Источники: " + s.scope.sources + " · факты и связи: " + s.scope.facts_and_relations;
  $("scope").textContent = JSON.stringify(s.scope, null, 2);
  $("send").disabled = busy || s.unfinished;
  return true;
}
async function restore() {
  if (await state()) {
    const history = await api("history");
    $("chat").replaceChildren();
    history.turns.forEach(turn => render(turn.question, turn.answer));
  }
}
function showError(err) { $("notice").textContent = err.message || "Проверьте соединение с локальным сервером."; }
document.querySelectorAll("[data-question]").forEach(button => button.onclick = () => {
  $("question").value = button.dataset.question;
  $("question").focus();
});
$("form").onsubmit = async event => {
  event.preventDefault();
  const question = $("question").value, mode = $("mode").value;
  if (busy || !question.trim()) return;
  if (!retry || question !== retry.question || mode !== retry.mode)
    retry = {question, mode, dialog, request_id:head};
  busy = $("send").disabled = true;
  try {
    const answer = await api("ask", retry);
    // A denial before admission has no durable row and must remain visible.
    await restore();
    if (!answer.question_needs_hash || answer.reason_code === "idempotency_conflict")
      $("notice").textContent = answer.text;
    if (!["blocked", "error"].includes(answer.status)) $("question").value = "";
    retry = null;
  } catch(err) { showError(err); }
  finally { busy = false; $("send").disabled = unfinished; }
};
$("recovery").onsubmit = async event => {
  event.preventDefault();
  const code = $("code").value;
  $("code").value = "";
  try { await api("recover", {code}); await restore(); } catch(err) { showError(err); }
};
for (const action of ["new", "reset"]) $(action).onclick = async () => {
  if (busy || (action === "reset" && !confirm("Очистить текущий лабораторный диалог?"))) return;
  try { await api("dialog/" + action, {}); retry = null; $("question").value = ""; await restore(); }
  catch(err) { showError(err); }
};
restore().catch(showError);
</script>
</body>
</html>
